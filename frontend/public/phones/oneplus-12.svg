<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="op12-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="50%" stop-color="#198754" />
      <stop offset="100%" stop-color="#0A3622" />
    </linearGradient>
    <linearGradient id="op12-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051B11" />
      <stop offset="50%" stop-color="#0E3A27" />
      <stop offset="100%" stop-color="#020B07" />
    </linearGradient>
    <filter id="phone-shadow-op12" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-op12)">
    <rect x="63" y="27" width="194" height="366" rx="28" fill="url(#op12-chassis)" stroke="#34D399" stroke-width="1.2" />
    <rect x="59" y="105" width="4" height="24" rx="2" fill="#0A3622" />
    <rect x="257" y="125" width="4" height="40" rx="2" fill="#0A3622" />

    <g clip-path="url(#op12-clip)">
      <clipPath id="op12-clip">
        <rect x="68" y="32" width="184" height="356" rx="24" />
      </clipPath>
      <rect x="68" y="32" width="184" height="356" fill="url(#op12-wp)" />
      
      <!-- Flowy Emerald Marble Wallpaper -->
      <path d="M68 280 C120 180 180 320 252 200 L252 388 L68 388 Z" fill="#10B981" opacity="0.4" />
      <circle cx="170" cy="190" r="50" fill="#6EE7B7" opacity="0.3" filter="blur(25px)" />

      <!-- Punch Hole -->
      <circle cx="160" cy="45" r="3.2" fill="#000000" />
      <circle cx="160" cy="45" r="1.1" fill="#34D399" opacity="0.8" />

      <!-- OnePlus Clock (with Red '1') -->
      <text x="160" y="90" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
        <tspan fill="#EF4444">1</tspan><tspan fill="#FFFFFF">0:30</tspan>
      </text>
      <text x="160" y="108" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#A7F3D0" text-anchor="middle">Never Settle · Hasselblad</text>

      <rect x="135" y="376" width="50" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5" />
    </g>
  </g>
</svg>
