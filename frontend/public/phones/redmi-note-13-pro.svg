<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="redmi-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <linearGradient id="redmi-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="phone-shadow-redmi" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-redmi)">
    <rect x="63" y="27" width="194" height="366" rx="22" fill="url(#redmi-chassis)" stroke="#A78BFA" stroke-width="1.2" />
    <rect x="257" y="115" width="4" height="40" rx="2" fill="#2E1065" />
    <rect x="257" y="165" width="4" height="26" rx="2" fill="#2E1065" />

    <g clip-path="url(#redmi-clip)">
      <clipPath id="redmi-clip">
        <rect x="68" y="32" width="184" height="356" rx="18" />
      </clipPath>
      <rect x="68" y="32" width="184" height="356" fill="url(#redmi-wp)" />
      
      <!-- Crystal Prism Wallpaper -->
      <polygon points="120,160 210,190 170,290 100,240" fill="#8B5CF6" opacity="0.4" filter="blur(20px)" />
      <circle cx="160" cy="220" r="45" fill="#C084FC" opacity="0.3" filter="blur(15px)" />

      <!-- Punch Hole -->
      <circle cx="160" cy="45" r="3.2" fill="#000000" />
      <circle cx="160" cy="45" r="1.1" fill="#8B5CF6" opacity="0.8" />

      <!-- Clock -->
      <text x="160" y="90" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">12:30</text>
      <text x="160" y="108" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#DDD6FE" text-anchor="middle">Redmi · 200MP OIS</text>

      <rect x="135" y="376" width="50" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5" />
    </g>
  </g>
</svg>
