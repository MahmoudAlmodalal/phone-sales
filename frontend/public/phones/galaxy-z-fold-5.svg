<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="fold-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="fold-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="phone-shadow-fold" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-fold)">
    <!-- Foldable Wide Format Body -->
    <rect x="45" y="32" width="230" height="356" rx="18" fill="url(#fold-chassis)" stroke="#BFDBFE" stroke-width="1.5" />
    <!-- Center Hinge Crease Hint -->
    <line x1="160" y1="36" x2="160" y2="384" stroke="#1E3A8A" stroke-width="1" opacity="0.3" />

    <g clip-path="url(#fold-clip)">
      <clipPath id="fold-clip">
        <rect x="50" y="37" width="220" height="346" rx="14" />
      </clipPath>
      <rect x="50" y="37" width="220" height="346" fill="url(#fold-wp)" />
      
      <!-- Butterfly Wing Foldable Wallpaper -->
      <path d="M160 210 Q90 120 70 240 Q120 320 160 210 Z" fill="#60A5FA" opacity="0.7" />
      <path d="M160 210 Q230 120 250 240 Q200 320 160 210 Z" fill="#38BDF8" opacity="0.7" />
      <circle cx="160" cy="210" r="30" fill="#FFFFFF" opacity="0.4" filter="blur(15px)" />

      <!-- Center Hinge subtle reflection -->
      <line x1="160" y1="37" x2="160" y2="383" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />

      <!-- Under Display Camera -->
      <circle cx="215" cy="52" r="3" fill="#000000" opacity="0.4" />

      <!-- Clock -->
      <text x="160" y="88" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">12:45</text>
      <text x="160" y="106" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#BFDBFE" text-anchor="middle">Galaxy Z Fold 5 · شاشة ٧٫٦ بوصة</text>

      <rect x="135" y="372" width="50" height="3" rx="1.5" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>
