<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <!-- Black Titanium Chassis -->
    <linearGradient id="ti-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B2A" />
      <stop offset="30%" stop-color="#4A4745" />
      <stop offset="60%" stop-color="#1F1D1C" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>
    <linearGradient id="ip15p-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="50%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <filter id="phone-shadow-ip15p" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-ip15p)">
    <rect x="62" y="26" width="196" height="368" rx="36" fill="url(#ti-black)" stroke="#57534E" stroke-width="1.5" />
    <rect x="58" y="80" width="4" height="24" rx="2" fill="#292524" />
    <rect x="58" y="115" width="4" height="36" rx="2" fill="#292524" />
    <rect x="58" y="160" width="4" height="36" rx="2" fill="#292524" />
    <rect x="258" y="125" width="4" height="50" rx="2" fill="#292524" />

    <g clip-path="url(#ip15p-clip)">
      <clipPath id="ip15p-clip">
        <rect x="68" y="32" width="184" height="356" rx="30" />
      </clipPath>
      <rect x="68" y="32" width="184" height="356" fill="url(#ip15p-wp)" />
      
      <!-- Titanium Rings Wallpaper -->
      <circle cx="160" cy="210" r="75" fill="#44403C" opacity="0.4" filter="blur(25px)" />
      <circle cx="140" cy="250" r="50" fill="#78716C" opacity="0.25" filter="blur(15px)" />

      <!-- Dynamic Island -->
      <rect x="137" y="44" width="46" height="14" rx="7" fill="#000000" />
      <circle cx="172" cy="51" r="2.8" fill="#1C1917" />
      <circle cx="146" cy="51" r="2" fill="#0C0A09" />

      <!-- Clock -->
      <text x="160" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="600" fill="#F5F5F4" text-anchor="middle">09:41</text>
      <text x="160" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#A8A29E" text-anchor="middle">iPhone 15 Pro · A17 Pro</text>

      <rect x="125" y="372" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>
