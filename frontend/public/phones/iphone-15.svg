<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <!-- Pastel Blue Aluminum Chassis -->
    <linearGradient id="ip15-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="ip15-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <filter id="phone-shadow-ip15" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-ip15)">
    <!-- Body Frame -->
    <rect x="62" y="26" width="196" height="368" rx="36" fill="url(#ip15-chassis)" stroke="#BAE6FD" stroke-width="1.5" />
    <rect x="58" y="115" width="4" height="36" rx="2" fill="#0284C7" />
    <rect x="58" y="160" width="4" height="36" rx="2" fill="#0284C7" />
    <rect x="258" y="130" width="4" height="48" rx="2" fill="#0284C7" />

    <!-- Screen -->
    <g clip-path="url(#ip15-clip)">
      <clipPath id="ip15-clip">
        <rect x="69" y="33" width="182" height="354" rx="30" />
      </clipPath>
      <rect x="69" y="33" width="182" height="354" fill="url(#ip15-wallpaper)" />
      
      <!-- Apple Fluid Rings Background -->
      <circle cx="160" cy="180" r="70" fill="#FFFFFF" opacity="0.3" filter="blur(30px)" />
      <circle cx="130" cy="240" r="60" fill="#F472B6" opacity="0.5" filter="blur(20px)" />
      
      <!-- Dynamic Island -->
      <rect x="137" y="44" width="46" height="14" rx="7" fill="#000000" />
      <circle cx="172" cy="51" r="2.8" fill="#1E293B" />
      <circle cx="146" cy="51" r="2" fill="#0F172A" />

      <!-- Clock -->
      <text x="160" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">09:41</text>
      <text x="160" y="110" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#E0F2FE" text-anchor="middle">صباح الخير</text>

      <!-- Home bar -->
      <rect x="125" y="372" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.7" />
    </g>
  </g>
</svg>
