<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="mi14-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="mi14-wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="40%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="phone-shadow-mi14" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-mi14)">
    <rect x="63" y="27" width="194" height="366" rx="24" fill="url(#mi14-chassis)" stroke="#10B981" stroke-width="1.2" />
    <rect x="257" y="120" width="4" height="40" rx="2" fill="#065F46" />
    <rect x="257" y="170" width="4" height="26" rx="2" fill="#065F46" />

    <g clip-path="url(#mi14-clip)">
      <clipPath id="mi14-clip">
        <rect x="68" y="32" width="184" height="356" rx="20" />
      </clipPath>
      <rect x="68" y="32" width="184" height="356" fill="url(#mi14-wp)" />
      
      <!-- HyperOS Nature Wave Wallpaper -->
      <path d="M68 200 Q140 130 252 220 L252 388 L68 388 Z" fill="#10B981" opacity="0.35" />
      <ellipse cx="160" cy="220" rx="60" ry="80" fill="#34D399" opacity="0.4" filter="blur(25px)" />
      
      <!-- Punch Hole -->
      <circle cx="160" cy="45" r="3.2" fill="#000000" />
      <circle cx="160" cy="45" r="1.1" fill="#10B981" opacity="0.8" />

      <!-- Clock -->
      <text x="160" y="90" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">08:16</text>
      <text x="160" y="108" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#A7F3D0" text-anchor="middle">Xiaomi HyperOS</text>

      <rect x="135" y="376" width="50" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5" />
    </g>
  </g>
</svg>
