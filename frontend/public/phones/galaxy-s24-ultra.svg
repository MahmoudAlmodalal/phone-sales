<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <!-- Titanium Gray Frame -->
    <linearGradient id="s24-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="30%" stop-color="#6B7280" />
      <stop offset="50%" stop-color="#374151" />
      <stop offset="80%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <!-- Screen Crystal Geometry Wallpaper (Galaxy S24 Ultra Theme) -->
    <linearGradient id="s24-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gem1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.7" />
    </linearGradient>
    <filter id="phone-shadow-s24" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow-s24)">
    <!-- Boxy Sharp-cornered Body with subtle 8px radius corners -->
    <rect x="58" y="24" width="204" height="372" rx="10" fill="url(#s24-chassis)" stroke="#9CA3AF" stroke-width="1.2" />

    <!-- Side Buttons on Right -->
    <rect x="262" y="110" width="4" height="42" rx="1.5" fill="#374151" />
    <rect x="262" y="165" width="4" height="30" rx="1.5" fill="#374151" />

    <!-- Display Screen (Edge-to-edge near bezel-less) -->
    <g clip-path="url(#s24-screen-clip)">
      <clipPath id="s24-screen-clip">
        <rect x="63" y="29" width="194" height="362" rx="7" />
      </clipPath>
      <rect x="63" y="29" width="194" height="362" fill="url(#s24-crystal)" />

      <!-- Galaxy S24 Ultra Faceted Minerals / Crystal Geometry -->
      <polygon points="160,140 220,200 180,290 110,260 90,170" fill="url(#gem1)" opacity="0.65" />
      <polygon points="160,140 220,200 170,220" fill="#FDE047" opacity="0.75" />
      <polygon points="110,260 180,290 140,330" fill="#6366F1" opacity="0.8" />
      <polygon points="90,170 160,140 120,220" fill="#38BDF8" opacity="0.6" />

      <!-- Glass Glare -->
      <path d="M63 29 L210 29 L100 391 L63 391 Z" fill="#FFFFFF" opacity="0.04" />

      <!-- Centered Punch Hole Front Camera -->
      <circle cx="160" cy="44" r="3.5" fill="#000000" />
      <circle cx="160" cy="44" r="1.3" fill="#1D4ED8" opacity="0.8" />

      <!-- Minimal Clock & Galaxy AI Sparkle -->
      <text x="160" y="88" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">10:08</text>
      <text x="160" y="108" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#93C5FD" text-anchor="middle">Galaxy AI ✨</text>

      <!-- Bottom Nav Bar Hint -->
      <rect x="135" y="380" width="50" height="3" rx="1.5" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>
