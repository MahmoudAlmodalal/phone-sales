<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <!-- Titanium Chassis Gradient -->
    <linearGradient id="ti-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C958E" />
      <stop offset="25%" stop-color="#BEB7B0" />
      <stop offset="50%" stop-color="#8E8780" />
      <stop offset="75%" stop-color="#B2ABA4" />
      <stop offset="100%" stop-color="#7A746E" />
    </linearGradient>
    <!-- Bezel Inner Border -->
    <linearGradient id="inner-bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1918" />
      <stop offset="100%" stop-color="#0D0C0B" />
    </linearGradient>
    <!-- Screen OLED Wallpaper (Natural Titanium Abstract Waves) -->
    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="35%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="screen-accent" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.85" />
    </linearGradient>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0E1311" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#phone-shadow)">
    <!-- Outer Titanium Body Frame -->
    <rect x="60" y="25" width="200" height="370" rx="38" fill="url(#ti-chassis)" stroke="#D8D2CB" stroke-width="1.5" />
    
    <!-- Side Buttons (Volume & Action on left, Power on right) -->
    <rect x="56" y="80" width="4" height="24" rx="2" fill="#7A746E" />
    <rect x="56" y="115" width="4" height="38" rx="2" fill="#7A746E" />
    <rect x="56" y="162" width="4" height="38" rx="2" fill="#7A746E" />
    <rect x="260" y="125" width="4" height="52" rx="2" fill="#7A746E" />

    <!-- Thin Black Display Border -->
    <rect x="64" y="29" width="192" height="362" rx="34" fill="url(#inner-bezel)" />

    <!-- Display Screen -->
    <g clip-path="url(#screen-clip-ip15)">
      <clipPath id="screen-clip-ip15">
        <rect x="68" y="33" width="184" height="354" rx="30" />
      </clipPath>
      <!-- Wallpaper Base -->
      <rect x="68" y="33" width="184" height="354" fill="url(#screen-bg)" />
      
      <!-- Fluid Swirling Curves of iOS 17 Pro Wallpaper -->
      <path d="M40 240 Q110 120 180 180 T260 260 L260 400 L40 400 Z" fill="url(#screen-accent)" />
      <ellipse cx="160" cy="220" rx="90" ry="110" fill="#3B82F6" opacity="0.3" filter="blur(20px)" />
      <circle cx="130" cy="260" r="50" fill="#F59E0B" opacity="0.35" filter="blur(16px)" />

      <!-- Screen Gloss & Glare Reflection -->
      <path d="M68 33 L220 33 L90 387 L68 387 Z" fill="#FFFFFF" opacity="0.04" />

      <!-- Dynamic Island Capsule -->
      <rect x="136" y="44" width="48" height="15" rx="7.5" fill="#000000" />
      <!-- Sensor & Front Camera dots inside Dynamic Island -->
      <circle cx="172" cy="51.5" r="3" fill="#1A1A1A" />
      <circle cx="172" cy="51.5" r="1.2" fill="#2563EB" opacity="0.7" />
      <circle cx="145" cy="51.5" r="2.2" fill="#141414" />

      <!-- Minimal Status / Lock Screen UI -->
      <text x="160" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.95">09:41</text>
      <text x="160" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#E2E8F0" text-anchor="middle" opacity="0.75">الأربعاء، ٢٤ أكتوبر</text>

      <!-- Bottom Home Indicator Bar -->
      <rect x="125" y="372" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>
